; TinyLora_MV_30/33S
; ESP32-S3 8MB flash, USB CDC for serial debug
; Ported from sakurapi-mv hardware configuration (same wiring, same panel).
;
; Original source: variants/esp32s3/sakurapi-mv/ in meshtastic_fw-sakurapi-mv

[env:tinylora_mv_30_33s]
extends = esp32s3_base
board = esp32-s3-devkitc-1
board_build.partitions = partition-table-8MB.csv
upload_protocol = esptool

platform_packages =
    platformio/framework-arduinoespressif32 @ https://github.com/Mymetu/framework-arduinoespressif32-pm/archive/cd62ed9.zip

build_unflags =
  -flto
  -std=c++11
  -std=gnu++11

build_flags = 
  ${esp32s3_base.build_flags}
  -D TINYLORA
  -D TINYLORA_MV_GAME
  -I variants/esp32s3/tinylora_mv_30_33s
  -D BOARD_HAS_PSRAM
  -D PRIVATE_HW
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ENABLE_GAMES_FRAME
  -DRADIOLIB_EXCLUDE_SX128X=1
  -DRADIOLIB_EXCLUDE_LR11X0=1
  -DMESHTASTIC_EXCLUDE_RANGETEST=1
  -DMESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  -DMESHTASTIC_EXCLUDE_SERIAL=1
  -DHAS_BBQ10_KEYBOARD=0
  -DHAS_MPR121_KEYBOARD=0
  -DHAS_TCA8418_KEYBOARD=0
  -DMESHTASTIC_EXCLUDE_ATAK=1
  -D EMOTE_COLOR_INCLUDE_CURRENCY=1
  -D EMOTE_COLOR_MINIMAL=1
  -D UI_LANG_ZH_CN
  -D TINYLORA_ADVANCED_IME
  ; LittleFS workaround for espressif32@6.13.0
  -D CONFIG_LITTLEFS_MAX_PARTITIONS=3
  -D CONFIG_LITTLEFS_PAGE_SIZE=256
  -D CONFIG_LITTLEFS_OBJ_NAME_LEN=64
  -D CONFIG_LITTLEFS_READ_SIZE=128
  -D CONFIG_LITTLEFS_WRITE_SIZE=128
  -D CONFIG_LITTLEFS_LOOKAHEAD_SIZE=128
  -D CONFIG_LITTLEFS_CACHE_SIZE=512
  -D CONFIG_LITTLEFS_BLOCK_CYCLES=512

lib_deps =
  ${esp32s3_base.lib_deps}
  # renovate: datasource=custom.pio depName=LovyanGFX packageName=lovyan03/library/LovyanGFX
  lovyan03/LovyanGFX@1.2.19
