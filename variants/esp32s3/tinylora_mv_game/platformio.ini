; TinyLora_MV_GAME
; ESP32-S3 N16R8 (16MB flash, 8MB PSRAM), USB CDC for serial debug
; Identical hardware setup to sakurapi-mv (same wiring, same panel) — we just
; build under the tinylora_mv_game matrix slot.
;
; Original source: variants/esp32s3/sakurapi-mv/ in meshtastic_fw-sakurapi-mv,
; adapted to the N16R8 board (16MB flash + opi PSRAM).

; The espressif32@6.13.0 platform does NOT ship an "ESP32-S3-WROOM-1-N16R8"
; board JSON, so we use the generic ESP32-S3-DevKitC-1 and override:
;   - 16MB flash (default is 8MB)
;   - octal PSRAM (default is none)
;   - default_16MB partition table
;   - 16MB max upload size
; USB CDC is already enabled via the board's extra_flags
; (ARDUINO_USB_MODE=1); we only need ARDUINO_USB_CDC_ON_BOOT=1 to expose Serial.

[env:tinylora_mv_game]
extends = esp32s3_base
board = esp32-s3-devkitc-1
board_level = pr
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
upload_protocol = esptool

; Note: Previously had a SCons rspfile workaround here for the Win32 32K
; command-line limit (xtensa-esp32s3-elf-g++ CreateProcess error). Removed
; because we now build on Linux (GitHub Actions / WSL native FS), which has
; no such limit. If we ever build on Windows again, revisit.

build_unflags =
  -flto
  -fno-lto
  -std=c++11
  -std=gnu++11

build_flags = 
  ${esp32s3_base.build_flags}
  -D TINYLORA_MV_GAME
  -D PRIVATE_HW
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ENABLE_GAMES_FRAME
  -I variants/esp32s3/tinylora_mv_game
  -ULED_BUILTIN

lib_deps =
  ${esp32s3_base.lib_deps}
  # LovyanGFX — ST7789 driver for shared SPI bus
  # renovate: datasource=custom.pio depName=LovyanGFX packageName=lovyan03/library/LovyanGFX
  lovyan03/LovyanGFX@1.2.19
  ; The framework's FS / LittleFS / SPIFFS ship with architectures=esp32 in
  ; their library.properties, so LDF skips them for S2/S3/C3/C6 by default.
  ; Listing them here in lib_deps forces LDF to scan and link them on every
  ; host, including fresh CI runners where the local lib_extra_dirs patch
  ; (USERPROFILE path) doesn't exist.
  FS
  LittleFS
  SPIFFS
