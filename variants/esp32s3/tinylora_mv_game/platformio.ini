; TinyLora_MV_GAME
; ESP32-S3 N16R8 (16MB flash, 8MB PSRAM), USB CDC for serial debug
; Minimal build: LoRa + LED + Button + Battery + Screen
; GPS code is staged in variant.h but currently commented out
; Reference: sakurapi-mv, slimmed down

; The espressif32@6.13.0 platform does NOT ship an "ESP32-S3-WROOM-1-N16R8"
; board JSON, so we use the generic ESP32-S3-DevKitC-1 and override:
;   - 16MB flash (default is 8MB)
;   - octal PSRAM (default is none)
;   - default_16MB partition table
;   - 16MB max upload size
; USB CDC is already enabled via the board's extra_flags
; (ARDUINO_USB_MODE=1); we only need ARDUINO_USB_CDC_ON_BOOT=1 to expose Serial.

[env:tinylora_mv_game]
extends = esp32s3_base
board = esp32-s3-devkitc-1
board_level = pr
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
upload_protocol = esptool

; S3 SDK injects 244 -I paths (Arduino-ESP32 sub-component includes) which
; pushes the g++ compile command line to ~32K chars — hits Win32's
; CreateProcess 32K limit ("xtensa-esp32s3-elf-g++: error: CreateProcess:
; No such file or directory" on BuzzerFeedbackThread.cpp, buzz.cpp, etc.).
; Force SCons to use response files (g++ @build.rsp) so the long flag list
; lives in a file, not the command line.
extra_scripts = pre:../../scripts/force_rspfile.py

build_unflags =
  -flto
  -fno-lto
  -std=c++11
  -std=gnu++11

build_flags =
  ${esp32s3_base.build_flags}
  -D TINYLORA_MV_GAME
  -D PRIVATE_HW
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D UI_LANG_ZH_CN
  -D OLED_CJK=1
  -D OLED_CJK_SIZE=10
  -D OLEDDISPLAY_UTF8_TOP_PADDING=2
  -D ENABLE_GAMES_FRAME
  -ULED_BUILTIN
  ; LittleFS.cpp in framework-arduinoespressif32 wraps the entire implementation
  ; in #ifdef CONFIG_LITTLEFS_PAGE_SIZE. S3's sdkconfig.h doesn't define any
  ; LITTLEFS macros, so the .cpp compiles to an empty .o. C3's sdkconfig does
  ; define them, which is why C3 builds work. We add the same set here.
  -D CONFIG_LITTLEFS_MAX_PARTITIONS=3
  -D CONFIG_LITTLEFS_PAGE_SIZE=256
  -D CONFIG_LITTLEFS_OBJ_NAME_LEN=64
  -D CONFIG_LITTLEFS_READ_SIZE=128
  -D CONFIG_LITTLEFS_WRITE_SIZE=128
  -D CONFIG_LITTLEFS_LOOKAHEAD_SIZE=128
  -D CONFIG_LITTLEFS_CACHE_SIZE=512
  -D CONFIG_LITTLEFS_BLOCK_CYCLES=512
  -I variants/esp32s3/tinylora_mv_game

lib_extra_dirs =
  ; Make the LDF scan the framework's own libraries/ dir. The bundled
  ; framework libs (FS, LittleFS, SPIFFS) are filtered by architectures=esp32
  ; in their library.properties — even after we patched that field, LDF
  ; doesn't auto-pick them up for non-esp32 targets because they're not
  ; in the project's lib_deps/lib_extra_dirs by default. Adding this dir
  ; makes LDF scan and link them. (We also edited those three
  ; library.properties to add esp32s2/s3/c3/c6 to architectures, in case
  ; `pio upgrade` clobbers the lib but not the architectures field.)
  ${sysenv.USERPROFILE}/.platformio/packages/framework-arduinoespressif32/libraries

lib_deps =
  ${esp32s3_base.lib_deps}

; =============================================================================
; Notes on non-obvious changes (in case anyone wonders "why this line?")
; =============================================================================
;
; build_unflags = -flto
;   Removing -flto from the upstream esp32-common chain. Without this, the
;   Arduino-ESP32 framework's -flto injected flag overrides ours, and LTO blows
;   out RAM on the S3.
;
; build_unflags = -fno-lto
;   Belt-and-suspenders: framework default has -fno-lto (no LTO); we explicitly
;   unflag it so that our -flto in build_flags takes effect cleanly.
;
; build_unflags = -std=c++11 / -std=gnu++11
;   The Arduino-ESP32 framework auto-injects C++11 std flags via -D in some
;   dependency configs. esp32-common originally has these unflags in its
;   build_unflags, but the inherits chain can lose them. We re-declare them
;   so esp32-common's -std=gnu++17 (in build_flags) wins and std::optional etc.
;   are available.
;
; -ULED_BUILTIN
;   The root platformio.ini defines LED_BUILTIN=-1 globally. The ESP32-S3 core
;   pins_arduino.h has a self-referential #define LED_BUILTIN LED_BUILTIN that
;   expands to -1 in the variable declaration, which is a syntax error. Using
;   -U undefines the macro so the S3 core's self-ref pattern works.
;
; LittleFS in lib_deps
;   See comment above. The framework's library.properties lists esp32 only,
;   so LDF skips the lib for S2/S3/C3/C6. lib_deps = LittleFS is *supposed*
;   to override that, but in practice LDF still filters by architecture first
;   for the framework libs. The real fix is editing
;   ~/.platformio/packages/framework-arduinoespressif32/libraries/{FS,LittleFS,SPIFFS}/library.properties
;   to add esp32s2,esp32s3,esp32c3,esp32c6 to architectures. We did that as a
;   one-time host fix; the lib_deps entry here is belt-and-suspenders in case
;   the host fix gets clobbered by `pio upgrade`.
;
