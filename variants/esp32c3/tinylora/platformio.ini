[tinylora_base]
lib_deps =
  ${esp32c3_base.lib_deps}
  adafruit/Adafruit NeoPixel @ ^1.12.0

[env:tinylora_v2_22s]
extends = esp32c3_base
board_meshcn = true
board = esp32-c3-devkitm-1
lib_deps = ${tinylora_base.lib_deps}
build_flags = 
  ${esp32_base.build_flags}
  -D TINYLORA_V2
  -D TINYLORA
  -I variants/esp32c3/tinylora
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D PERSISTENT_RANDOM_MAC
  -D LED_POWER=2

