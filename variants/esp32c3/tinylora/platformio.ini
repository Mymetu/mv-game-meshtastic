[env:tinylora_mv]
extends = esp32c3_base
board_level = pr
board_meshcn = true
board = tinylora
board_build.flash_mode = dio
board_build.f_flash = 20000000L
board_build.arduino.memory_type = dio_qspi
board_build.partitions = variants/esp32c3/tinylora/tinylora_mv-8M.csv
lib_deps = ${tinylora_base.lib_deps}
build_flags = 
  ${esp32_base.build_flags}
  -D TINYLORA
  -D TINYLORA_MV
  -D TINYLORA_ADVANCED_IME
  -D MESHTASTIC_EXCLUDE_WEBSERVER=1
  -I variants/esp32c3/tinylora
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D PERSISTENT_RANDOM_MAC
  -D GPS_EN_EARLY_PULLDOWN
  -D DISABLE_STARTUP_TONE

[env:tinylora_mv_zhcn]
extends = esp32c3_base
board_level = pr
board_meshcn = true
board = tinylora
board_build.flash_mode = dio
board_build.f_flash = 20000000L
board_build.arduino.memory_type = dio_qspi
board_build.partitions = variants/esp32c3/tinylora/tinylora_mv-8M.csv
lib_deps = ${tinylora_base.lib_deps}
build_flags = 
  ${esp32_base.build_flags}
  -D TINYLORA
  -D TINYLORA_MV
  -D TINYLORA_ADVANCED_IME
  -D MESHTASTIC_EXCLUDE_WEBSERVER=1
  -I variants/esp32c3/tinylora
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D UI_LANG_ZH_CN
  -D OLED_CJK=1
  -D OLED_CJK_SIZE=10
  -D OLEDDISPLAY_UTF8_TOP_PADDING=2
  -D PERSISTENT_RANDOM_MAC
  -D ENABLE_GAMES_FRAME
  -D ENABLE_TEAM_MODE
  -D GPS_EN_EARLY_PULLDOWN
  -D DISABLE_STARTUP_TONE
