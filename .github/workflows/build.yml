name: Build Tinylora Variants

# Builds the two tinylora variants (S3 game + C3 zhcn) on every push / PR.
# ~3-5 min per build. Use the workflow_dispatch trigger for manual runs.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - tinylora_mv_30_33s    # ESP32-S3 240x320 landscape (testing new 2.4" screen)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'variants/**/platformio.ini', '.github/workflows/build.yml') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Install mklittlefs (needed for FS image step on Linux)
        run: |
          # meshtastic fw's build process invokes `mklittlefs` directly (not
          # the full path), so the binary must be on PATH. apt doesn't always
          # have it, so we pull from the earlephilhower GitHub release.
          # Asset naming: x86_64-linux-gnu-mklittlefs-<gitsha>.tar.gz
          cd /tmp
          curl -fsSL -o mklittlefs.tar.gz \
            "https://github.com/earlephilhower/mklittlefs/releases/download/4.1.0/x86_64-linux-gnu-mklittlefs-42acb97.tar.gz"
          tar -xzf mklittlefs.tar.gz
          chmod +x mklittlefs/mklittlefs
          sudo install -m 755 mklittlefs/mklittlefs /usr/local/bin/mklittlefs
          rm -rf mklittlefs.tar.gz mklittlefs
          mklittlefs --version || echo "mklittlefs installed (binary on PATH)"

      - name: Pre-install framework (so it's on disk before patch)
        run: |
          # Install environment dependencies including the custom framework.
          # This downloads framework-arduinoespressif32 to ~/.platformio/packages
          # so the next step can patch its library.properties.
          pio pkg install -e ${{ matrix.env }}

      - name: Patch framework FS/LittleFS/SPIFFS architectures for S3/C3 builds
        run: |
          # Arduino-ESP32 framework's FS, LittleFS, and SPIFFS libraries ship
          # with `architectures=esp32` in their library.properties. PlatformIO's
          # LDF filters them out for S2/S3/C3/C6 targets, so any code that
          # references fs::LittleFSFS (e.g. FSCommon, DebugRenderer, RangeTest,
          # HTTP handlers) fails to link with "undefined reference to LittleFS".
          #
          # The framework's LittleFS.cpp also wraps its implementation in
          # `#ifdef CONFIG_LITTLEFS_PAGE_SIZE`. ESP32-S3's sdkconfig.h does NOT
          # define these macros on platform espressif32@6.13.0 (it did on
          # 6.12.0), so we add them as build flags in each variant's
          # platformio.ini.
          #
          # This step patches the framework's library.properties to include
          # esp32s2/esp32s3/esp32c3/esp32c6, so LDF picks them up automatically
          # for our build matrix (tinylora_mv_30_33s = S3, tinylora_mv_zhcn = C3).
          # Without this, even `lib_deps = FS LittleFS SPIFFS` won't override
          # the architecture filter at link time.
          set -e
          FW_LIB_DIR="$HOME/.platformio/packages/framework-arduinoespressif32/libraries"
          if [ ! -d "$FW_LIB_DIR" ]; then
            echo "::error::framework-arduinoespressif32 libraries dir not found at $FW_LIB_DIR after pre-install"
            exit 1
          fi
          for lib in FS LittleFS SPIFFS; do
            prop="$FW_LIB_DIR/$lib/library.properties"
            if [ -f "$prop" ]; then
              if grep -q '^architectures=esp32$' "$prop"; then
                sed -i 's/^architectures=esp32$/architectures=esp32,esp32s2,esp32s3,esp32c3,esp32c6/' "$prop"
                echo "Patched $lib/library.properties"
              else
                echo "$lib/library.properties already patched or unusual architectures field; leaving as-is"
              fi
            else
              echo "::error::$prop not found after pre-install"
              exit 1
            fi
          done

      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}

      - name: Upload firmware to Release
        if: success() && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: firmware-${{ matrix.env }}
          name: "${{ matrix.env }} firmware (auto-built)"
          body: |
            Auto-built firmware for **${{ matrix.env }}**.
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
          files: |
            .pio/build/${{ matrix.env }}/firmware-${{ matrix.env }}-*.factory.bin
            .pio/build/${{ matrix.env }}/firmware-${{ matrix.env }}-*.bin
            .pio/build/${{ matrix.env }}/littlefs-${{ matrix.env }}-*.bin
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
