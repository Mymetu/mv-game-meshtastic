name: Build Tinylora Variants

# Builds the two tinylora variants (S3 game + C3 zhcn) on every push / PR.
# ~3-5 min per build. Use the workflow_dispatch trigger for manual runs.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - tinylora_mv_game    # ESP32-S3 N16R8 (game frame)
          - tinylora_mv_zhcn   # ESP32-C3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'variants/**/platformio.ini', '.github/workflows/build.yml') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Install mklittlefs (needed for FS image step on Linux)
        run: |
          # meshtastic fw's build process invokes `mklittlefs` directly (not
          # the full path), so the binary must be on PATH. apt doesn't always
          # have it, so we pull from the earlephilhower GitHub release.
          # Asset naming: x86_64-linux-gnu-mklittlefs-<gitsha>.tar.gz
          cd /tmp
          curl -fsSL -o mklittlefs.tar.gz \
            "https://github.com/earlephilhower/mklittlefs/releases/download/4.1.0/x86_64-linux-gnu-mklittlefs-42acb97.tar.gz"
          tar -xzf mklittlefs.tar.gz
          sudo mv mklittlefs /usr/local/bin/
          rm mklittlefs.tar.gz
          mklittlefs --version || echo "mklittlefs installed (binary on PATH)"

      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}

      - name: Upload ${{ matrix.env }} firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          # Grab everything PIO produced for this env. Includes:
          #   firmware-<env>-<ver>.<hash>.bin            (app partition)
          #   firmware-<env>-<ver>.<hash>.factory.bin    (merged, ready to flash at 0x0)
          #   firmware-<env>-<ver>.<hash>.elf            (debug symbols, ~80MB)
          #   littlefs-<env>-<ver>.<hash>.bin           (FS image)
          #   bootloader.bin, partitions.bin
          # User wants ALL build files preserved, so no exclusion.
          path: .pio/build/${{ matrix.env }}/*
          if-no-files-found: error
          retention-days: 14
